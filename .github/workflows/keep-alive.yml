name: Keep Alive Supabase

on:
  schedule:
    # Corre todos los días a las 09:00 UTC (06:00 AM hora de Argentina)
    - cron: '0 9 * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub si es necesario

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -i -X GET "https://xtotkopfqbvaqwxjnuhi.supabase.co/rest/v1/" \
          -H "apikey: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}"
