<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Esquema Temporal Bono Cupón Cero</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
</head>
<body class="bg-slate-50 p-4 font-sans text-slate-800 flex justify-center">
  <div class="max-w-4xl w-full bg-white rounded-2xl shadow-md border border-slate-200 p-6">
    <div class="flex items-center justify-between border-b border-slate-100 pb-3 mb-6">
      <div>
        <span class="text-xs uppercase tracking-wider font-bold text-purple-600 bg-purple-50 px-2.5 py-1 rounded-md">Bono Cupón Cero</span>
        <h3 class="text-lg font-bold text-slate-900 mt-1">Esquema Temporal de Flujos (Zero-Coupon)</h3>
      </div>
      <div class="text-xs text-slate-500 font-medium bg-slate-100 px-3 py-1.5 rounded-lg">
        Sin Cupones Intermedios + Pago Único al Vencimiento
      </div>
    </div>

    <!-- Timeline Graphic -->
    <div class="relative overflow-x-auto py-6">
      <div class="min-w-[500px] px-8">
        <!-- Labels Top: Momentos -->
        <div class="flex justify-between text-xs font-bold text-slate-600 mb-2">
          <div class="w-20 text-center">Momento 0</div>
          <div class="w-32 text-center text-slate-400 font-medium italic">Período de maduración (sin flujos)</div>
          <div class="w-24 text-center font-extrabold text-purple-700">Momento n</div>
        </div>

        <!-- Axis Line with Nodes -->
        <div class="relative flex items-center justify-between my-4">
          <!-- Main Line -->
          <div class="absolute left-10 right-12 h-1.5 bg-gradient-to-r from-slate-300 via-purple-200 to-purple-400 -z-0"></div>
          
          <!-- Node 0 -->
          <div class="relative z-10 w-20 flex justify-center">
            <div class="w-5 h-5 rounded-full bg-slate-400 border-4 border-white shadow-sm"></div>
          </div>

          <!-- Mid decorative pulse -->
          <div class="relative z-10 w-32 flex justify-center">
            <span class="text-xs text-purple-400 font-semibold px-2 py-0.5 bg-purple-50 rounded-full border border-purple-100">Devengamiento implícito</span>
          </div>

          <!-- Node n -->
          <div class="relative z-10 w-24 flex justify-center">
            <div class="w-6 h-6 rounded-full bg-purple-600 border-4 border-white shadow ring-2 ring-purple-200"></div>
          </div>
        </div>

        <!-- Bottom: Cash Flows -->
        <div class="flex justify-between items-start text-xs pt-2">
          <!-- Momento 0 -->
          <div class="w-20 text-center text-slate-500 font-semibold text-[11px]">
            Precio inicial ($P_0 < V_n$)
          </div>
          <!-- Center -->
          <div class="w-32 text-center text-slate-300"></div>
          <!-- n -->
          <div class="w-24 text-center">
            <span class="inline-block px-3 py-1.5 bg-purple-600 text-white rounded-lg font-extrabold text-xs shadow-md">
              Capital ($V_n$)
            </span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      renderMathInElement(document.body, {
        delimiters: [
          { left: "$$", right: "$$", display: true },
          { left: "$", right: "$", display: false }
        ],
        throwOnError: false
      });
    });
  </script>
</body>
</html>
