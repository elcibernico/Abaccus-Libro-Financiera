<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Esquema Temporal Bono Bullet</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
</head>
<body class="bg-slate-50 p-4 font-sans text-slate-800 flex justify-center">
  <div class="max-w-4xl w-full bg-white rounded-2xl shadow-md border border-slate-200 p-6">
    <div class="flex items-center justify-between border-b border-slate-100 pb-3 mb-6">
      <div>
        <span class="text-xs uppercase tracking-wider font-bold text-blue-600 bg-blue-50 px-2.5 py-1 rounded-md">Bono Bullet</span>
        <h3 class="text-lg font-bold text-slate-900 mt-1">Esquema Temporal de Flujos</h3>
      </div>
      <div class="text-xs text-slate-500 font-medium bg-slate-100 px-3 py-1.5 rounded-lg">
        Interés Periódico + Capital al Vencimiento
      </div>
    </div>

    <!-- Timeline Graphic -->
    <div class="relative overflow-x-auto py-6">
      <div class="min-w-[620px] px-4">
        <!-- Labels Top: Momentos -->
        <div class="flex justify-between text-xs font-bold text-slate-600 mb-2">
          <div class="w-12 text-center">Momento 0</div>
          <div class="w-12 text-center">1</div>
          <div class="w-12 text-center">2</div>
          <div class="w-12 text-center">3</div>
          <div class="w-12 text-center text-slate-400">...</div>
          <div class="w-12 text-center">n-1</div>
          <div class="w-12 text-center font-extrabold text-blue-700">n</div>
        </div>

        <!-- Axis Line with Nodes -->
        <div class="relative flex items-center justify-between my-4">
          <!-- Main Line -->
          <div class="absolute left-6 right-6 h-1 bg-slate-300 -z-0"></div>
          
          <!-- Node 0 -->
          <div class="relative z-10 w-12 flex justify-center">
            <div class="w-5 h-5 rounded-full bg-slate-400 border-4 border-white shadow-sm"></div>
          </div>
          <!-- Node 1 -->
          <div class="relative z-10 w-12 flex justify-center">
            <div class="w-5 h-5 rounded-full bg-blue-500 border-4 border-white shadow-sm"></div>
          </div>
          <!-- Node 2 -->
          <div class="relative z-10 w-12 flex justify-center">
            <div class="w-5 h-5 rounded-full bg-blue-500 border-4 border-white shadow-sm"></div>
          </div>
          <!-- Node 3 -->
          <div class="relative z-10 w-12 flex justify-center">
            <div class="w-5 h-5 rounded-full bg-blue-500 border-4 border-white shadow-sm"></div>
          </div>
          <!-- Node Dots -->
          <div class="relative z-10 w-12 flex justify-center">
            <span class="text-slate-400 font-bold tracking-widest">•••</span>
          </div>
          <!-- Node n-1 -->
          <div class="relative z-10 w-12 flex justify-center">
            <div class="w-5 h-5 rounded-full bg-blue-500 border-4 border-white shadow-sm"></div>
          </div>
          <!-- Node n -->
          <div class="relative z-10 w-12 flex justify-center">
            <div class="w-6 h-6 rounded-full bg-indigo-600 border-4 border-white shadow ring-2 ring-indigo-200"></div>
          </div>
        </div>

        <!-- Bottom: Cash Flows -->
        <div class="flex justify-between items-start text-xs pt-2">
          <!-- Momento 0 -->
          <div class="w-12 text-center text-slate-400 font-semibold italic text-[11px]">
            Emisión
          </div>
          <!-- 1 -->
          <div class="w-12 text-center">
            <span class="inline-block px-2 py-1 bg-blue-50 text-blue-700 border border-blue-200 rounded font-semibold text-[11px] shadow-sm">Interés</span>
          </div>
          <!-- 2 -->
          <div class="w-12 text-center">
            <span class="inline-block px-2 py-1 bg-blue-50 text-blue-700 border border-blue-200 rounded font-semibold text-[11px] shadow-sm">Interés</span>
          </div>
          <!-- 3 -->
          <div class="w-12 text-center">
            <span class="inline-block px-2 py-1 bg-blue-50 text-blue-700 border border-blue-200 rounded font-semibold text-[11px] shadow-sm">Interés</span>
          </div>
          <!-- Dots -->
          <div class="w-12 text-center text-slate-300"></div>
          <!-- n-1 -->
          <div class="w-12 text-center">
            <span class="inline-block px-2 py-1 bg-blue-50 text-blue-700 border border-blue-200 rounded font-semibold text-[11px] shadow-sm">Interés</span>
          </div>
          <!-- n -->
          <div class="w-12 text-center flex flex-col gap-1 items-center">
            <span class="inline-block px-2 py-1 bg-blue-100 text-blue-800 border border-blue-300 rounded font-bold text-[11px] shadow-sm">Interés</span>
            <span class="inline-block px-2 py-1 bg-indigo-600 text-white rounded font-extrabold text-[11px] shadow-sm">Capital</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      renderMathInElement(document.body, {
        delimiters: [
          { left: "$$", right: "$$", display: true },
          { left: "$", right: "$", display: false }
        ],
        throwOnError: false
      });
    });
  </script>
</body>
</html>
